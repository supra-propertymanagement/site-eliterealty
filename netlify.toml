[build]
  publish = "."
  # Rewrites sitemap.xml with real per-page dates from git (see README.md).
  command = "node scripts/sitemap.mjs --netlify"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
